image devboot.vfat {
	vfat {
		label = "DEVBOOT"
		extraargs = "-i 53544D31"

		files = {
			"zImage",
			"stm32mp157c-odyssey.dtb"
		}
	}

	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "5f7e0e57-9f64-4eb1-8b14-4c33dbec7c01"
	}

	partition fsbl1 {
		image = "tf-a-stm32mp157c-odyssey.stm32"
	}

	partition fsbl2 {
		image = "tf-a-stm32mp157c-odyssey.stm32"
	}

	partition ssbl {
		image = "u-boot.stm32"
	}

	partition rootfs {
		image = "rootfs.ext4"
		bootable = "yes"
	}

	partition devboot {
		partition-type-uuid = F
		image = "devboot.vfat"
	}
}
