image devboot.vfat {
	vfat {
		label = "DEVBOOT"
		extraargs = "-i AFFB4506"

		files = {
			"zImage",
			"stm32mp157c-odyssey.dtb"
		}
	}

	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
		disk-uuid = "346cbe79-c96a-5911-8cb0-f9fa76782e5a"
	}

	partition fsbl1 {
		image = "tf-a-stm32mp157c-odyssey.stm32"
	}

	partition fsbl2 {
		image = "tf-a-stm32mp157c-odyssey.stm32"
	}

	partition ssbl {
		image = "u-boot.stm32"
	}

	partition rootfs {
		image = "rootfs.ext4"
		bootable = "yes"
	}

	partition devboot {
		partition-type-uuid = F
		image = "devboot.vfat"
	}
}
